<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>RSVP</title>
 <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
 <style>
 * { box-sizing: border-box; margin: 0; padding: 0; }

 body {
 font-family: "Quicksand", -apple-system, BlinkMacSystemFont, sans-serif;
 background: linear-gradient(135deg, #ffd1dc 0%, #f3a5d0 18%, #e0a3e5 35%, #c8a2e8 52%, #b18cd9 68%, #d4a5e8 84%, #ffb6d9 100%);
 background-size: 400% 400%;
 animation: gradientShift 18s ease infinite;
 min-height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
 padding: 20px;
 position: relative;
 overflow-x: hidden;
 }

 body::before, body::after {
 content: "";
 position: fixed;
 border-radius: 50%;
 filter: blur(80px);
 opacity: 0.55;
 pointer-events: none;
 z-index: 0;
 }
 body::before {
 width: 380px; height: 380px;
 background: radial-gradient(circle, #c084fc, transparent 70%);
 top: -120px; left: -120px;
 animation: blob 14s ease-in-out infinite;
 }
 body::after {
 width: 460px; height: 460px;
 background: radial-gradient(circle, #ff80ab, transparent 70%);
 bottom: -160px; right: -160px;
 animation: blob 18s ease-in-out infinite reverse;
 }

 @keyframes blob {
 0%, 100% { transform: translate(0, 0) scale(1); }
 33% { transform: translate(60px, 40px) scale(1.1); }
 66% { transform: translate(-40px, 30px) scale(0.95); }
 }

 @keyframes gradientShift {
 0%, 100% { background-position: 0% 50%; }
 50% { background-position: 100% 50%; }
 }

 .sparkle {
 position: fixed;
 font-size: 22px;
 pointer-events: none;
 opacity: 0.7;
 animation: float 6s ease-in-out infinite;
 filter: drop-shadow(0 2px 4px rgba(168, 85, 247, 0.4));
 z-index: 2;
 }
 .sparkle:nth-child(1) { top: 10%; left: 8%; animation-delay: 0s; }
 .sparkle:nth-child(2) { top: 20%; right: 12%; animation-delay: 1s; }
 .sparkle:nth-child(3) { bottom: 15%; left: 10%; animation-delay: 2s; }
 .sparkle:nth-child(4) { bottom: 25%; right: 8%; animation-delay: 3s; }
 .sparkle:nth-child(5) { top: 50%; left: 4%; animation-delay: 1.5s; }
 .sparkle:nth-child(6) { top: 60%; right: 5%; animation-delay: 2.5s; }
 .sparkle:nth-child(7) { top: 35%; left: 14%; animation-delay: 3.5s; }
 .sparkle:nth-child(8) { top: 75%; right: 16%; animation-delay: 0.5s; }

 @keyframes float {
 0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.5; }
 25% { transform: translateY(-15px) rotate(-10deg) scale(1.1); opacity: 0.9; }
 50% { transform: translateY(-28px) rotate(20deg) scale(1.2); opacity: 1; }
 75% { transform: translateY(-15px) rotate(10deg) scale(1.1); opacity: 0.9; }
 }

 .card {
 background: rgba(255, 255, 255, 0.92);
 border-radius: 24px;
 padding: 44px 40px;
 max-width: 480px;
 width: 100%;
 box-shadow: 0 20px 60px rgba(168, 85, 247, 0.35),
 0 0 0 1px rgba(216, 180, 254, 0.5);
 backdrop-filter: blur(14px);
 -webkit-backdrop-filter: blur(14px);
 position: relative;
 z-index: 1;
 animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both,
 floatCard 6s ease-in-out infinite 1s;
 }

 .card::before {
 content: "";
 position: absolute;
 inset: -2px;
 border-radius: 24px;
 padding: 2px;
 background: linear-gradient(135deg, #ff80ab, #c084fc, #a855f7, #ff80ab);
 background-size: 300% 300%;
 animation: borderFlow 6s linear infinite;
 -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
 -webkit-mask-composite: xor;
 mask-composite: exclude;
 opacity: 0.6;
 pointer-events: none;
 }

 @keyframes borderFlow {
 0% { background-position: 0% 50%; }
 100% { background-position: 300% 50%; }
 }

 @keyframes cardIn {
 0% { opacity: 0; transform: translateY(30px) scale(0.92) rotate(-2deg); }
 100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
 }

 @keyframes floatCard {
 0%, 100% { transform: translateY(0); }
 50% { transform: translateY(-6px); }
 }

 h1 {
 font-family: "Dancing Script", cursive;
 margin-bottom: 4px;
 font-size: 44px;
 text-align: center;
 font-weight: 700;
 background: linear-gradient(90deg, #d63384, #c084fc, #a855f7, #ff4d94, #d63384);
 background-size: 200% auto;
 -webkit-background-clip: text;
 background-clip: text;
 -webkit-text-fill-color: transparent;
 animation: shimmer 4s linear infinite, titleIn 0.9s ease both;
 }

 @keyframes shimmer {
 to { background-position: 200% center; }
 }
 @keyframes titleIn {
 from { opacity: 0; transform: translateY(-10px) scale(0.9); }
 to { opacity: 1; transform: translateY(0) scale(1); }
 }

 .subtitle {
 color: #8b5cf6;
 text-align: center;
 margin-bottom: 28px;
 font-size: 15px;
 font-weight: 600;
 animation: fadeIn 1s 0.2s ease both;
 }

 @keyframes fadeIn {
 from { opacity: 0; transform: translateY(6px); }
 to { opacity: 1; transform: translateY(0); }
 }

 .field {
 margin-bottom: 18px;
 animation: slideIn 0.6s ease both;
 }
 .field:nth-of-type(1) { animation-delay: 0.30s; }
 .field:nth-of-type(2) { animation-delay: 0.40s; }
 .field:nth-of-type(3) { animation-delay: 0.50s; }
 .field:nth-of-type(4) { animation-delay: 0.60s; }

 @keyframes slideIn {
 from { opacity: 0; transform: translateX(-14px); }
 to { opacity: 1; transform: translateX(0); }
 }

 label {
 display: block;
 font-weight: 600;
 color: #a64d79;
 margin-bottom: 6px;
 font-size: 14px;
 letter-spacing: 0.3px;
 transition: color 0.2s, transform 0.2s;
 }

 .field:focus-within label {
 color: #ff4d94;
 transform: translateX(4px);
 }

 input[type="text"],
 input[type="number"],
 select {
 width: 100%;
 padding: 12px 14px;
 border: 1.5px solid #ffd1dc;
 border-radius: 12px;
 font-size: 15px;
 font-family: inherit;
 background: #fff9fb;
 color: #5a3a4d;
 transition: border-color 0.25s, box-shadow 0.25s, background 0.25s, transform 0.2s;
 }

 input:hover, select:hover {
 border-color: #ffb6d9;
 }

 input:focus, select:focus {
 outline: none;
 border-color: #ff80ab;
 background: #fff;
 box-shadow: 0 0 0 4px rgba(255, 128, 171, 0.2);
 transform: translateY(-1px);
 }

 button {
 position: relative;
 width: 100%;
 padding: 14px;
 background: linear-gradient(135deg, #ff80ab 0%, #ff4d94 50%, #ff80ab 100%);
 background-size: 200% 100%;
 color: #fff;
 border: none;
 border-radius: 30px;
 font-size: 16px;
 font-weight: 700;
 font-family: inherit;
 letter-spacing: 0.5px;
 cursor: pointer;
 margin-top: 12px;
 box-shadow: 0 6px 18px rgba(255, 77, 148, 0.4);
 transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s, background-position 0.4s;
 overflow: hidden;
 animation: slideIn 0.6s 0.7s ease both, pulse 2.4s 1.5s ease-in-out infinite;
 }

 button::after {
 content: "";
 position: absolute;
 top: 0; left: -100%;
 width: 100%; height: 100%;
 background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
 transition: left 0.6s ease;
 }
 button:hover:not(:disabled)::after { left: 100%; }

 button:hover:not(:disabled) {
 transform: translateY(-2px);
 background-position: 100% 0;
 box-shadow: 0 10px 24px rgba(255, 77, 148, 0.5);
 }
 button:active:not(:disabled) { transform: translateY(0) scale(0.98); }
 button:disabled { opacity: 0.6; cursor: not-allowed; animation: none; }

 @keyframes pulse {
 0%, 100% { box-shadow: 0 6px 18px rgba(255, 77, 148, 0.4); }
 50% { box-shadow: 0 6px 28px rgba(255, 77, 148, 0.7); }
 }

 .status {
 margin-top: 16px;
 padding: 12px;
 border-radius: 12px;
 text-align: center;
 font-size: 14px;
 font-weight: 600;
 display: none;
 }

 .status.success {
 display: block;
 background: #ffe5f1;
 color: #b5167a;
 border: 1px solid #ffb6d9;
 animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
 }

 .status.error {
 display: block;
 background: #ffe0e0;
 color: #b00020;
 border: 1px solid #ffb3b3;
 animation: shake 0.5s ease;
 }

 @keyframes bounceIn {
 0% { opacity: 0; transform: scale(0.6) translateY(10px); }
 60% { opacity: 1; transform: scale(1.06) translateY(-4px); }
 100% { opacity: 1; transform: scale(1) translateY(0); }
 }

 @keyframes shake {
 0%, 100% { transform: translateX(0); }
 20%, 60% { transform: translateX(-8px); }
 40%, 80% { transform: translateX(8px); }
 }

 #confettiCanvas {
 position: fixed;
 inset: 0;
 width: 100%;
 height: 100%;
 pointer-events: none;
 z-index: 9999;
 display: none;
 }

 .celebrate {
 animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
 }
 @keyframes pop {
 0% { transform: scale(1) rotate(0deg); }
 30% { transform: scale(1.06) rotate(-1deg); }
 60% { transform: scale(1.03) rotate(1deg); }
 100% { transform: scale(1) rotate(0deg); }
 }

 .heart {
 position: absolute;
 pointer-events: none;
 font-size: 18px;
 opacity: 0;
 animation: heartRise 1.2s ease-out forwards;
 }

 @keyframes heartRise {
 0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
 20% { opacity: 1; }
 100% { opacity: 0; transform: translate(-50%, -80px) scale(1.3); }
 }
 </style>
</head>
<body>
 <span class="sparkle">✨</span>
 <span class="sparkle">🎀</span>
 <span class="sparkle">💖</span>
 <span class="sparkle">🌸</span>
 <span class="sparkle">✨</span>
 <span class="sparkle">🦋</span>

 <canvas id="confettiCanvas"></canvas>

 <div class="card" id="card">
 <h1>You're Invited!</h1>
 <p class="subtitle">💕 Please let us know if you can make it 💕</p>

 <form id="rsvpForm">
 <div class="field">
 <label for="name">Kid's Name</label>
 <input type="text" id="name" name="name" required />
 </div>

 <div class="field">
 <label for="response">Will you attend?</label>
 <select id="response" name="response" required>
 <option value="">-- Select --</option>
 <option value="Yes">Yes</option>
 <option value="No">No</option>
 </select>
 </div>

 <div class="field">
 <label for="adults">Number of Adults</label>
 <input type="number" id="adults" name="adults" min="0" value="0" required />
 </div>

 <div class="field">
 <label for="kids">Number of Kids</label>
 <input type="number" id="kids" name="kids" min="0" value="0" required />
 </div>

 <button type="submit" id="submitBtn">Submit</button>
 <div class="status" id="status"></div>
 </form>
 </div>

 <script>
 // Replace with your deployed Google Apps Script Web App URL
 const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfOOvaJX250K2SZilRKPjqXTkN2mGWTygtF6WN5yoZTjBQ4xc7B2ZbJcQW2dLWpgNH/exec";

 const form = document.getElementById("rsvpForm");
 const status = document.getElementById("status");
 const btn = document.getElementById("submitBtn");
 const card = document.getElementById("card");
 const canvas = document.getElementById("confettiCanvas");
 const ctx = canvas.getContext("2d");

 function resizeCanvas() {
 canvas.width = window.innerWidth;
 canvas.height = window.innerHeight;
 }
 window.addEventListener("resize", resizeCanvas);
 resizeCanvas();

 const CONFETTI_COLORS = ["#ff80ab", "#ff4d94", "#ffb6d9", "#ffd1dc", "#d63384", "#ffc0cb", "#ffe5f1"];
 const CONFETTI_EMOJIS = ["💖", "🎀", "✨", "🌸", "🦋", "💕"];

 function launchConfetti(durationMs = 2800) {
 canvas.style.display = "block";
 const pieces = [];
 const total = 160;

 for (let i = 0; i < total; i++) {
 const useEmoji = Math.random() < 0.25;
 pieces.push({
 x: Math.random() * canvas.width,
 y: -20 - Math.random() * canvas.height * 0.5,
 vx: (Math.random() - 0.5) * 3,
 vy: 2 + Math.random() * 4,
 size: useEmoji ? 18 + Math.random() * 14 : 6 + Math.random() * 8,
 rot: Math.random() * Math.PI * 2,
 vr: (Math.random() - 0.5) * 0.3,
 color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
 emoji: useEmoji ? CONFETTI_EMOJIS[Math.floor(Math.random() * CONFETTI_EMOJIS.length)] : null,
 shape: Math.random() < 0.5 ? "rect" : "circle",
 });
 }

 const start = performance.now();

 function tick(now) {
 const elapsed = now - start;
 ctx.clearRect(0, 0, canvas.width, canvas.height);

 pieces.forEach((p) => {
 p.x += p.vx;
 p.y += p.vy;
 p.vy += 0.05;
 p.rot += p.vr;

 ctx.save();
 ctx.translate(p.x, p.y);
 ctx.rotate(p.rot);

 if (p.emoji) {
 ctx.font = `${p.size}px serif`;
 ctx.textAlign = "center";
 ctx.textBaseline = "middle";
 ctx.fillText(p.emoji, 0, 0);
 } else {
 ctx.fillStyle = p.color;
 if (p.shape === "rect") {
 ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
 } else {
 ctx.beginPath();
 ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
 ctx.fill();
 }
 }
 ctx.restore();
 });

 if (elapsed < durationMs) {
 requestAnimationFrame(tick);
 } else {
 ctx.clearRect(0, 0, canvas.width, canvas.height);
 canvas.style.display = "none";
 }
 }
 requestAnimationFrame(tick);
 }

 function burstHearts(target) {
 const rect = target.getBoundingClientRect();
 const emojis = ["💖", "💕", "💗", "💝"];
 for (let i = 0; i < 6; i++) {
 const h = document.createElement("span");
 h.className = "heart";
 h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
 h.style.left = rect.left + rect.width / 2 + (Math.random() - 0.5) * 60 + "px";
 h.style.top = rect.top + rect.height / 2 + "px";
 h.style.position = "fixed";
 h.style.animationDelay = (i * 0.05) + "s";
 document.body.appendChild(h);
 setTimeout(() => h.remove(), 1400);
 }
 }

 form.addEventListener("submit", async (e) => {
 e.preventDefault();
 burstHearts(btn);
 btn.disabled = true;
 btn.textContent = "Submitting...";
 status.className = "status";
 status.textContent = "";

 const data = {
 name: form.name.value.trim(),
 response: form.response.value,
 adults: Number(form.adults.value) || 0,
 kids: Number(form.kids.value) || 0,
 timestamp: new Date().toISOString(),
 };

 try {
 await fetch(SCRIPT_URL, {
 method: "POST",
 mode: "no-cors",
 headers: { "Content-Type": "application/json" },
 body: JSON.stringify(data),
 });

 status.className = "status success";
 status.textContent = "🌸 Yay! Your RSVP has been recorded 🌸";
 form.reset();

 launchConfetti();
 card.classList.remove("celebrate");
 void card.offsetWidth;
 card.classList.add("celebrate");
 } catch (err) {
 status.className = "status error";
 status.textContent = "Something went wrong. Please try again.";
 } finally {
 btn.disabled = false;
 btn.textContent = "Submit";
 }
 });
 </script>
</body>
</html>
