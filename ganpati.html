<head>

    <style>
        html, body {
            margin: 0;

        body {
            background: linear-gradient(to right, #f4b005, #f87204, rgb(243, 65, 1)) !important;

         .t {
            font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;

  <title>ganpati</title>

<body class="text-white text-center">
<div class="d-flex justify-content-center align-items-center vh-100">
<button id="b" onclick="playMusic()" class="btn btn-primary p-3 py-3 px-5 w-5 h-3">start</button>
<p id="text"></p>
</div>
<div
  id="player"
  style="
    position:absolute;
    width:1px;
    height:1px;
    left:-9999px;
    overflow:hidden;
  ">
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
  let player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      height: "1",
      width: "1",
      videoId: "flEbMsWL0RE",
      playerVars: {
        autoplay: 0,
        controls: 0,
        start: 57,
        end: 80
      }
    });
  }

  function playMusic() {
    let Button = document.getElementById("b");
    if (player && player.playVideo) {
      player.playVideo();
    } else {
      console.log("Player not ready yet");
    }
    Button.style.display = 'none';
    let text = document.getElementById("text");
    text.innerHTML = "<h3>वक्रतुण्ड महाकाय सूर्यकोटि समप्रभा। निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥</h3><br>    <div class='row'><div class='col-md-4'><img src='https://freepngimg.com/thumb/ganesha/67184-ganesha.png' width='200px' height='200px'></div><div class='col-md-4'><img src='https://freepngimg.com/thumb/ganesha/67184-ganesha.png' width='200px' height='200px'></div><div class='col-md-4'><img src='https://freepngimg.com/thumb/ganesha/67184-ganesha.png' width='200px' height='200px'></div></div><br><br><h2>With the blessings of Lord Ganesha we warmly invite you and your family to join us for the Ganesh aarti</h2><br><br> <p>Daily aarti: 7pm  Tuesday to Thursday <br><br>Aarti and Visarjan: Friday 6:30pm <br><br> at Agrawal's home<br><br><small>Come seek bappa's blessings and celebrate this auspicious occasion with us</small></p><br><br><h3 class=' t animate__animated animate__heartBeat animate__infinite'>Ganpati Bappa Morya!</h3>";
    }
</script>
