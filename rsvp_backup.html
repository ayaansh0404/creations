<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      color: #777;
      text-align: center;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're Invited!</h1>
    <p class="subtitle">Please let us know if you can make it</p>

    <form id="rsvpForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="field">
        <label for="response">Will you attend?</label>
        <select id="response" name="response" required>
          <option value="">-- Select --</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>

      <div class="field">
        <label for="adults">Number of Adults</label>
        <input type="number" id="adults" name="adults" min="0" value="0" required />
      </div>

      <div class="field">
        <label for="kids">Number of Kids</label>
        <input type="number" id="kids" name="kids" min="0" value="0" required />
      </div>

      <button type="submit" id="submitBtn">Submit</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    // Replace with your deployed Google Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4Evz14RkcPaJpDzXmlc4skOyM3Mt5Lvme4Sffsl3A1mIUgMvnyFPFNpvgJ4IjUrSlrA/exec";

    const form = document.getElementById("rsvpForm");
    const status = document.getElementById("status");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Submitting...";
      status.className = "status";
      status.textContent = "";

      const data = {
        name: form.name.value.trim(),
        response: form.response.value,
        adults: Number(form.adults.value) || 0,
        kids: Number(form.kids.value) || 0,
        timestamp: new Date().toISOString(),
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        status.className = "status success";
        status.textContent = "Thanks! Your RSVP has been recorded.";
        form.reset();
      } catch (err) {
        status.className = "status error";
        status.textContent = "Something went wrong. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit";
      }
    });
  </script>
</body>
</html>
