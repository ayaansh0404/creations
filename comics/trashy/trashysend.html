<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Send Comic</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #212529;
            color: white;
        }

        .box {
            width: 500px;
            max-width: 90%;
            margin: 150px auto;
            text-align: center;
        }

        #send {
            display: none;
        }
    </style>

</head>

<body>

    <div class="box">

        <h1>Send a Comic</h1>

        <p>Enter code</p>

        <input type="password"
               id="code"
               class="form-control"
               placeholder="Code">

        <button class="btn btn-danger mt-3"
                onclick="checkCode()">
            Enter
        </button>

        <p id="message" class="mt-3"></p>


        <div id="send">

            <p>Send me your comic on WhatsApp</p>

            <a href="https://wa.me/17034239147?text=Here%20is%20my%20trashycomic!"
               target="_blank"
               class="btn btn-success">
                Send Comic
            </a>
            <a href="https://ayaansh0404.github.io/creations/comics/trashy.html"
               target="_blank"
               class="btn btn-success">
                See comics
            </a>

        </div>

    </div>


    <footer class="text-center bg-danger p-4">

        <p class="text-white mb-0">
            &copy; 2026 Comic Strips by Ayaansh Agrawal. All rights reserved.
        </p>

    </footer>


    <script>

        function checkCode() {

            var code = document.getElementById("code").value;

            if (code.toLowerCase() == "liam") {

                document.getElementById("message").innerHTML =
                    "Correct code";

                document.getElementById("send").style.display =
                    "block";

            } else {

                document.getElementById("message").innerHTML =
                    "Wrong code";

                document.getElementById("send").style.display =
                    "none";

            }

        }

    </script>

</body>

</html>
