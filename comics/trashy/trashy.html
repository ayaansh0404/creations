<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ayaansh Agrawal - Comic Strips</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="nobgperson.png">
   
        <style>
  body { 
    margin: 0; 
    background-color: #212529; 
  } 
  #imageCarousel { 
    width: 100vw; 
    height: 85vh; /* Shrinks carousel to make room for the footer */
  } 
  .carousel-inner, .carousel-item { 
    width: 100%; 
    height: 100%; 
  } 
  .image-wrapper { 
    width: 100%; 
    height: 100%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    overflow: hidden; 
  } 
  .image-wrapper img { 
    width: 100vh; 
    height: 100vw; 
    object-fit: contain; 
    transform: rotate(90deg); 
    margin-left: 10px; 
    margin-right: 10px; 
  } 
  #updown img { 
    width: 100vh; 
    height: 100vw; 
    object-fit: contain; 
    transform: rotate(-90deg); 
  } 
  .carousel-control-prev, .carousel-control-next { 
    width: 10%; 
  }
</style>

</head>

<body>

    <div id="imageCarousel" class="carousel slide" data-bs-ride="carousel">

        <!-- button -->
        <div class="carousel-indicators">
            
        </div>


        <!-- Images -->
        <div class="carousel-inner">
</div>


        <!-- Previous -->
        <button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel" data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>
        </button>


        <!-- Next -->
        <button class="carousel-control-next" type="button" data-bs-target="#imageCarousel" data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>
        </button>

    </div>
<footer class="text-center bg-danger p-4">
   <p class="text-white">&copy; 2026 Comic Strips by Ayaansh Agrawal. All rights reserved. New comics uploaded daily!</p>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
